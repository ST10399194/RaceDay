

name: RaceDay CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test RaceDay
    runs-on: ubuntu-latest

    steps:
      # Download the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install .NET 8.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore NuGet packages.
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      # Build all projects in the solution.
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      # Run the API integration tests.
      - name: Run API tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
