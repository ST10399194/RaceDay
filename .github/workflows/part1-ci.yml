name: Part 1 Documentation Check

on:
  push:
  pull_request:

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Check docs folder
        run: |
          if [ -d "docs" ]; then
            echo "✓ docs folder exists"
          else
            echo "✗ docs folder is missing"
            exit 1
          fi

      - name: Check ERD
        run: |
          if [ -f "docs/RaceDay_ERD.pdf" ]; then
            echo "✓ RaceDay_ERD.pdf found"
          else
            echo "✗ RaceDay_ERD.pdf is missing"
            exit 1
          fi

      - name: Check API Endpoint Plan
        run: |
          if [ -f "docs/RaceDay_API_Endpoint_Plan.pdf" ]; then
            echo "✓ RaceDay_API_Endpoint_Plan.pdf found"
          else
            echo "✗ RaceDay_API_Endpoint_Plan.pdf is missing"
            exit 1
          fi

      - name: Check SQL Script
        run: |
          if [ -f "docs/RaceDay_Database.sql" ]; then
            echo "✓ RaceDay_Database.sql found"
          else
            echo "✗ RaceDay_Database.sql is missing"
            exit 1
          fi

      - name: Check README
        run: |
          if [ -f "README.md" ]; then
            echo "✓ README.md found"
          else
            echo "✗ README.md is missing"
            exit 1
          fi
